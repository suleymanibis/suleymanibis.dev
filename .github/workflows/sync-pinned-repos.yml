name: Sync pinned repositories

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync pinned repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: suleymanibis
        run: node scripts/sync-pinned-repos.mjs
      - name: Commit generated data when changed
        run: |
          if git diff --quiet -- generated/pinned-projects.js; then
            echo "Pinned repository data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/pinned-projects.js
          git commit -m "chore: sync pinned repositories"
          git push
